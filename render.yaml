services:
  - type: web
    name: technical-planning-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn backend.main:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_LLM
        value: "0"
      - key: RAG_BACKEND
        value: tfidf
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@local.test
      - key: ADMIN_PASSWORD
        sync: false
